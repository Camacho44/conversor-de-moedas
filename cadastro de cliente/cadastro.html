<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        /* Estilização Geral da Página */
        body {
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estrutura do Corpo da Calculadora */
        .calculadora {
            background-color: #202020;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        /* Visor/Display */
        #display {
            width: 100%;
            height: 60px;
            background-color: #1c1c1c;
            color: #ffffff;
            font-size: 2rem;
            border: none;
            border-radius: 8px;
            text-align: right;
            padding: 10px 15px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        /* Grade dos Botões (Grid) */
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        /* Estilo Padrão dos Botões */
        button {
            height: 60px;
            font-size: 1.4rem;
            border: none;
            border-radius: 8px;
            background-color: #3b3b3b;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Efeito de Clique */
        button:hover {
            background-color: #505050;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Estilo dos Botões de Operadores (+, -, *, /) */
        .operador {
            background-color: #ff9500;
            color: #ffffff;
        }

        .operador:hover {
            background-color: #e08300;
        }

        /* Botão C (Limpar) */
        .limpar {
            background-color: #a5a5a5;
            color: #000000;
        }

        .limpar:hover {
            background-color: #d4d4d2;
        }

        /* Botão do Zero (ocupa 2 colunas) */
        .zero {
            grid-column: span 2;
        }

        /* Botão de Igual */
        .igual {
            background-color: #ff9500;
        }
    </style>
</head>
<body>

    <!-- Estrutura HTML -->
    <div class="calculadora">
        <!-- Visor da calculadora -->
        <input type="text" id="display" disabled placeholder="0">

        <!-- Botões -->
        <div class="botoes">
            <button class="limpar" onclick="limparDisplay()">C</button>
            <button onclick="apagarUltimo()">⌫</button>
            <button class="operador" onclick="adicionarValor('/')">÷</button>
            <button class="operador" onclick="adicionarValor('*')">×</button>

            <button onclick="adicionarValor('7')">7</button>
            <button onclick="adicionarValor('8')">8</button>
            <button onclick="adicionarValor('9')">9</button>
            <button class="operador" onclick="adicionarValor('-')">-</button>

            <button onclick="adicionarValor('4')">4</button>
            <button onclick="adicionarValor('5')">5</button>
            <button onclick="adicionarValor('6')">6</button>
            <button class="operador" onclick="adicionarValor('+')">+</button>

            <button onclick="adicionarValor('1')">1</button>
            <button onclick="adicionarValor('2')">2</button>
            <button onclick="adicionarValor('3')">3</button>
            <button class="igual" onclick="calcular()">=</button>

            <button class="zero" onclick="adicionarValor('0')">0</button>
            <button onclick="adicionarValor('.')">,</button>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const display = document.getElementById('display');

        // Adiciona números ou operadores ao visor
        function adicionarValor(valor) {
            display.value += valor;
        }

        // Limpa todo o visor (Botão C)
        function limparDisplay() {
            display.value = '';
        }

        // Apaga o último caractere digitado
        function apagarUltimo() {
            display.value = display.value.slice(0, -1);
        }

        // Realiza o cálculo da expressão matemática
        function calcular() {
            try {
                // A função eval() calcula a expressão escrita dentro da string
                if (display.value) {
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Erro';
                setTimeout(() => {
                    display.value = '';
                }, 1500);
            }
        }
    </script>
</body>
</html>
