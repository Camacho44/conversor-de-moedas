<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- JS -->
    <script src="./scripts.js" defer></script>
    <title>C-FX</title>

</head>
<body>
    <div>
        <img src="./assets/bank.png" id="fundo">
    </div>
    
    <main>
        <label>
            Converter <b>de</b>  
            <select class="select-coin-value">
                <option value="BRL">R$ Real </option>
                <option value="USD">$ Dólar</option>
                <option value="EUR">€ Euro</option>
                <option value="BTC">₿ Bitcon</option>
                <option value="GBP">£ Libra</option>
            </select>
        </label>
        <label >
            Converter <b>para</b>  
            <select class="converted-currency-value">
                <option value="USD">$ Dólar</option>
                <option value="BRL">R$ Real</option>
                <option value="EUR">€ Euro</option>
                <option value="BTC">₿ Bitcon</option>
                <option value="GBP">£ Libra</option> 
            </select>
        </label>
        <label>
            Valor a ser convertido
            <input 
                    class="input-value"
                    type="number" 
                    step="0.01" 
                    min="0" 
                    placeholder="$ 0.00">    
        </label>

        <button class="convert-button">Converter</button>

        <section>   
            <div class="box">
                
                <img 
                class="logo-currency"
                id="img-first-currency"                          
                src="./assets/real-currency.png" 
                alt="logo-moeda" >
                
                <p 
                class="currency"
                id="currency-first-text">Real</p>
                <p 
                class="value">
                <b>R$ 0,00</b></p>
            </div>

             <div class="box">
                <img 
                class="logo-currency"
                id="img-second-currency"
                src="./assets/US-dollar-currency.png" 
                alt="logo-moeda" > 
                <p 
                class="currency" 
                id ="currency-second-text"> Dólar</p>
                <p 
                class="value-converted">
                <b>$ 0,00</b></p>
            </div>
        </section>
    </main>    
</body>
</html>
